[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-in-5-days-assessment-agent"
version = "1.0.0"
description = "Multilingual (EN/ES/PT) AgentOps Assessment Agent built with Google ADK 2.0 to audit AI agent repositories against the 95-point AI in 5 Days Code Review Matrix."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "google-adk>=1.14.0",
    "google-genai>=1.20.0",
    "google-cloud-aiplatform[adk,agent_engines]>=1.100.0",
    "google-cloud-secret-manager>=2.23.0",
    "google-cloud-dlp>=3.27.0",
    "google-cloud-logging>=3.11.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-gcp-trace>=1.9.0",
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.setuptools.packages.find]
include = ["assessment_agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
asyncio_mode = "auto"
